interface:
  display_name: "Review Changes"
  short_description: "Code review that loads the project's own rules, never blocks a merge, and approves only when nothing blocking survives"
  default_prompt: "Use review-changes on the current diff. Publish findings as non-blocking suggestions."

policy:
  allow_implicit_invocation: true
  read_only_repository: true
  write_scopes:
    - github_pull_request_review_comment
    - github_pull_request_review_approve
    # --local only: one markdown report outside the repository.
    - local_report_file_outside_repository
  gated_actions:
    # Only for a diff that changes no behavior, or one where only suggestions
    # survive a full-coverage review; after the user's explicit go on the
    # printed body. Under the literal --auto flag only, the skill's own
    # verdict is that go; the publisher's refusals still stand. Never under
    # --dry-run.
    - pull_request_approve
  forbidden_actions:
    - pull_request_request_changes
    - pull_request_merge
